server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  add_header Referrer-Policy no-referrer always;
  location / {
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
  location /assets/ {
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "public,max-age=31536000,immutable";
    try_files $uri =404;
  }
}
