services:
  web:
    image: nginx:1.30.0-alpine
    restart: unless-stopped
    volumes:
      - /opt/private-communication/web:/usr/share/nginx/html:ro
      - /opt/private-communication/web.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - '8080'
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/']
      interval: 10s
      timeout: 3s
      retries: 3
